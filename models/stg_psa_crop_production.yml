version: 2

models:
  - name: stg_psa_crop_production
    description: "Staged long-format PSA crop production area dataset."
    columns:
      - name: ecosystem_croptype
        tests:
          - not_null
      - name: geolocation
        tests:
          - not_null

  - name: int_psa_crop_production_transformed
    description: "Intermediate layer with parsed production year and quarter."

  - name: fct_psa_crop_production
    description: "Final fact table aggregated by crop type, location, year, and quarter."
    columns:
      - name: ecosystem_croptype
        tests:
          - not_null
      - name: geolocation
        tests:
          - not_null
      - name: production_year
        tests:
          - not_null